<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Enquiry received | Aviral Goyal</title>
<style>:root {
  color-scheme:dark;
  --bg:#050810;
  --surface:#0f1830;
  --border:#1a2a50;
  --text:#e8eeff;
  --muted:#9aa9d0;
  --cyan:#67e8f9
}
* {
  box-sizing:border-box
}
body {
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  background:radial-gradient(ellipse at top right,#111c3b 0,transparent 55%),var(--bg);
  color:var(--text);
  font:16px/1.7 system-ui,-apple-system,Segoe UI,sans-serif;
  padding:20px
}
.card {
  max-width:620px;
  border:1px solid var(--border);
  background:var(--surface);
  border-radius:20px;
  padding:clamp(24px,5vw,48px)
}
.mark {
  font-size:2rem;
  color:var(--cyan)
}
h1 {
  font-size:clamp(2rem,6vw,3.2rem);
  line-height:1.1;
  margin:.5rem 0 1rem
}
p {
  color:var(--muted)
}
a {
  display:inline-block;
  margin-top:18px;
  padding:11px 16px;
  border-radius:10px;
  background:#2563eb;
  color:#fff;
  text-decoration:none
}

/* Phase 1: keep utility pages readable on small screens. */
main {
  width: 100%;
  min-width: 0;
  overflow-wrap: anywhere;
}
a {
  overflow-wrap: anywhere;
}
@media (max-width: 480px) {
  main {
    padding: 28px 16px 48px;
  }
  h1 {
    font-size: clamp(1.9rem, 9vw, 2.8rem);
    line-height: 1.1;
    text-wrap: balance;
  }
  .links {
    gap: .65rem;
  }
  .links a,
  .primary {
    max-width: 100%;
    text-align: center;
  }
}

</style>
</head>
<body><main class="card"><div class="mark" aria-hidden="true">✓</div><h1>Thanks for reaching out.</h1><p>Your enquiry has been submitted. If your message is time-sensitive, you can also email <a href="mailto:aviralgoyal739@gmail.com">aviralgoyal739@gmail.com</a>.</p><a href="/">Return to portfolio</a></main></body></html>
