<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Page not found | Aviral Goyal</title>
<style>:root {
  color-scheme:dark;
  --bg:#080a0f;
  --surface:#10151f;
  --border:#252d3b;
  --text:#f3f5f8;
  --muted:#a7b0bf;
  --cyan:#9edbd7
}
* {
  box-sizing:border-box
}
body {
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  background:radial-gradient(ellipse at 80% 0%,rgba(114,133,167,.12),transparent 40%),var(--bg);
  color:var(--text);
  font:16px/1.7 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  padding:20px
}
.card {
  max-width:620px;
  border:1px solid var(--border);
  background:var(--surface);
  border-radius:20px;
  padding:clamp(24px,5vw,48px)
}
.code {
  font:600 .75rem/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:.16em;
  color:var(--cyan)
}
h1 {
  font-size:clamp(2rem,6vw,3.2rem);
  line-height:1.1;
  letter-spacing:-.04em;
  margin:.6rem 0 1rem
}
p {
  color:var(--muted);
  margin:0 0 1.2rem
}
.links {
  display:flex;
  flex-wrap:wrap;
  gap:.7rem
}
a {
  display:inline-block;
  padding:11px 18px;
  border-radius:999px;
  border:1px solid #394556;
  color:var(--text);
  text-decoration:none;
  font-weight:600
}
a.primary {
  background:var(--text);
  border-color:var(--text);
  color:#0a0d12
}
a:hover {
  border-color:#8c9bb0
}
a:focus-visible {
  outline:2px solid var(--cyan);
  outline-offset:3px
}
</style>
</head>
<body><main class="card"><div class="code">ERROR 404</div><h1>That page doesn&rsquo;t exist.</h1><p>The link may be old or mistyped. You can head back to the portfolio or jump straight to the projects.</p><div class="links"><a class="primary" href="/">Back to portfolio</a><a href="/#projects">View projects</a><a href="/#contact">Get in touch</a></div></main></body>
</html>
