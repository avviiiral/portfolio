<text x="1172" y="170" class="panelhead">AI Explanation Layer</text>
<circle cx="1182" cy="238" r="6" fill="#6366f1"/><text x="1206" y="244" class="small" font-weight="700">Positive relationship</text><text x="1206" y="278" class="small muted">Higher marketing spend is</text><text x="1206" y="306" class="small muted">associated with higher sales</text><text x="1206" y="334" class="small muted">(correlation r = 0.84).</text>
<circle cx="1182" cy="395" r="6" fill="#6366f1"/><text x="1206" y="401" class="small" font-weight="700">Consistent upward trend</text><text x="1206" y="435" class="small muted">The sample points follow a</text><text x="1206" y="463" class="small muted">clear positive trend across</text><text x="1206" y="491" class="small muted">the observed range.</text>
<circle cx="1182" cy="552" r="6" fill="#6366f1"/><text x="1206" y="558" class="small" font-weight="700">Review outliers</text><text x="1206" y="592" class="small muted">A small number of points sit</text><text x="1206" y="620" class="small muted">away from the fitted line and</text><text x="1206" y="648" class="small muted">may need further inspection.</text>
