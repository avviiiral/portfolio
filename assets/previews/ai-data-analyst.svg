<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">AI Data Analyst Agent — synthetic analytics workspace</title>
<desc id="d">Light interface with dataset inspection, deterministic scatter analysis, summary statistics and an AI explanation panel.</desc>
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
 <style>text{font-family:Inter,Arial,sans-serif;fill:#172033}.muted{fill:#64748b}.small{font-size:20px}.tiny{font-size:17px}.head{font-size:32px;font-weight:700}.panelhead{font-size:24px;font-weight:700}.border{stroke:#d8e0ec;stroke-width:2}</style>
</defs>
